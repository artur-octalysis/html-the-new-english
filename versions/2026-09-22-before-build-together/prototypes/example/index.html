<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A small first contribution</title><style>*{box-sizing:border-box}body{margin:0;background:#eff2e7;color:#1b2517;font:18px/1.5 Arial,sans-serif;padding:clamp(24px,7vw,80px);min-height:100vh;display:grid;place-items:center}main{max-width:620px;width:100%}small{font:14px monospace;letter-spacing:.1em}h1{font-size:clamp(44px,7vw,72px);letter-spacing:-.055em;line-height:1;margin:24px 0}p{color:#526046}button{font:inherit;border:1px solid #8b9a7b;background:transparent;color:#1b2517;border-radius:8px;padding:12px 18px;cursor:pointer}button:focus-visible{outline:3px solid #ff6333;outline-offset:4px}button[aria-pressed=true]{background:#d7ff65;border-color:#52642f}.topics{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0}label{display:block;margin-bottom:8px}textarea{font:inherit;width:100%;min-height:100px;border:1px solid #8b9a7b;border-radius:8px;padding:12px;background:white;color:#1b2517}#share{background:#1b2517;color:#d7ff65;margin-top:16px}#result{padding:18px;border-left:4px solid #1b2517;margin-top:20px}#reset{margin-left:8px}.hint{font-size:14px}</style></head><body><main><small>WORKSHOP EXAMPLE / FICTIONAL COMMUNITY</small><h1>Your perspective<br>starts something.</h1><p>Choose a topic and share one small idea the group could explore.</p><div class="topics" role="group" aria-label="Choose a topic"><button aria-pressed="true">Learning</button><button aria-pressed="false">Connection</button><button aria-pressed="false">Creativity</button></div><label for="idea">Your idea</label><textarea id="idea" maxlength="240" placeholder="What if we…"></textarea><button id="share">Share an idea ↗</button><button id="reset">Reset</button><p id="result" role="status" hidden></p><p class="hint">Local demo only. No data is saved or sent.</p></main><script>let topic='Learning';const idea=document.getElementById('idea'),result=document.getElementById('result');document.querySelectorAll('.topics button').forEach(button=>button.onclick=()=>{topic=button.textContent;document.querySelectorAll('.topics button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))});document.getElementById('share').onclick=()=>{result.hidden=false;result.textContent=idea.value.trim()?'An idea for '+topic.toLowerCase()+': “'+idea.value.trim()+'” — what could someone add to it?':'Add a short idea before sharing.';if(!idea.value.trim())idea.focus()};document.getElementById('reset').onclick=()=>{idea.value='';result.hidden=true;idea.focus()};</script></body></html>
