<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Every move counts</title><style id="app-css">* { box-sizing: border-box; }
body { margin: 0; padding: 24px; background: #f2f7fc; color: #0e2a6e; font-family: system-ui, sans-serif; }
main { max-width: 420px; margin: auto; }
h1 { font-size: 36px; line-height: 1.1; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stats p, form, li, .buddy { background: white; padding: 16px; border-radius: 16px; }
strong { font-size: 28px; display: block; }
.buddy { display: flex; gap: 12px; align-items: center; }
.avatar { flex: none; width: 44px; height: 44px; border-radius: 50%; background: #ffd9a8; color: #6b3a00; display: grid; place-items: center; font-weight: 700; }
form { display: flex; flex-direction: column; gap: 12px; }
label { display: grid; gap: 6px; }
input, select, button { font: inherit; padding: 12px; border: 1px solid #b7cfe5; border-radius: 8px; }
input[aria-invalid="true"] { border-color: #b3261e; }
button { background: #005cc2; color: white; cursor: pointer; }
:focus-visible { outline: 3px solid #ffb547; outline-offset: 2px; }
#feedback p { margin: 0 0 6px; }
#feedback .error { color: #b3261e; }
ul { list-style: none; padding: 0; }
li { margin-bottom: 8px; }</style></head><body><!-- APP HTML START --><main>
  <p>MOVE / YOUR DAILY MOMENTUM</p>
  <h1>Every move counts.</h1>
  <p>A little movement. A little more you.</p>
  <div class="stats">
    <p><strong id="minutes">0</strong> minutes</p>
    <p><strong id="sessions">0</strong> activities</p>
  </div>
  <p class="buddy"><span class="avatar" aria-hidden="true">S</span><span>Sam, your walking buddy, is getting back into it too. Log a move and Sam will cheer you on.</span></p>
  <form id="activity-form" novalidate>
    <label>Activity <select name="activity"><option>Walk</option><option>Run</option></select></label>
    <label>Minutes <input name="minutes" type="number" min="1" max="300" step="1" value="10" required inputmode="numeric"></label>
    <button type="button" id="log-activity">Log my activity</button>
  </form>
  <div id="feedback" role="status"><p>Start with a moment of movement.</p></div>
  <ul id="activities" aria-label="Logged activities"></ul>
</main><!-- APP HTML END --><script id="app-js">const activities = [];
const form = document.getElementById('activity-form');
const feedback = document.getElementById('feedback');

function say(lines, isError) {
  feedback.replaceChildren(...lines.map(text => {
    const p = document.createElement('p');
    p.textContent = text;
    if (isError) p.className = 'error';
    return p;
  }));
}

// Sam is a fictional buddy: company on the way back, never a comparison.
function cheer(activity) {
  const verb = activity.type === 'Run' ? 'running' : 'walking';
  if (activities.length === 1) return 'Sam: "You\'re back! ' + activity.minutes + ' minutes of ' + verb + ' counts. Glad we\'re doing this together."';
  return 'Sam: "That\'s ' + activities.length + ' moves logged. I\'m right here with you."';
}

form.addEventListener('submit', event => {
  event.preventDefault();
  const input = form.elements.minutes;
  const raw = input.value.trim();
  const minutes = Number(raw);
  if (raw === '' || !Number.isInteger(minutes) || minutes < 1 || minutes > 300) {
    input.setAttribute('aria-invalid', 'true');
    input.focus();
    say(['Enter whole minutes from 1 to 300. Even 5 minutes counts.'], true);
    return;
  }
  input.removeAttribute('aria-invalid');
  const activity = { type: form.elements.activity.value, minutes };
  activities.push(activity);
  document.getElementById('minutes').textContent = activities.reduce((sum, item) => sum + item.minutes, 0);
  document.getElementById('sessions').textContent = activities.length;
  const row = document.createElement('li');
  row.textContent = activity.type + ' · ' + minutes + ' minutes';
  document.getElementById('activities').prepend(row);
  const next = Math.max(5, Math.min(minutes, 20));
  say([cheer(activity), 'Next: a ' + next + '-minute walk with Sam tomorrow?']);
  parent.postMessage({ source: 'move-starter', activity }, '*');
});
// Keep activity logging local: the gallery sandbox blocks native form submissions.
const activityForm = document.getElementById('activity-form');
const logActivityButton = document.getElementById('log-activity');
logActivityButton.addEventListener('click', () => {
  activityForm.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
});
activityForm.elements.minutes.addEventListener('keydown', event => {
  if (event.key === 'Enter') {
    event.preventDefault();
    logActivityButton.click();
  }
});
</script></body></html>
