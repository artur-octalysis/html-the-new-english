<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Every move counts</title><style id="app-css">* { box-sizing: border-box; }
body { margin: 0; padding: 24px; background: #f2f7fc; color: #0e2a6e; font-family: system-ui, sans-serif; }
main { max-width: 420px; margin: auto; }
h1 { font-size: 32px; line-height: 1.1; margin-bottom: 4px; }
.tagline { margin-top: 0; color: #3a5a9c; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.stats p, .goal, form, li { background: white; padding: 16px; border-radius: 16px; }
strong { font-size: 28px; display: block; }
.goal { margin-bottom: 16px; }
.goal p { margin: 0 0 8px; font-weight: 600; }
progress { width: 100%; height: 14px; border-radius: 8px; }
progress::-webkit-progress-bar { background: #e3ecf7; border-radius: 8px; }
progress::-webkit-progress-value { background: #005cc2; border-radius: 8px; }
form { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
label { display: grid; gap: 6px; }
input, select, button { font: inherit; padding: 12px; border: 1px solid #b7cfe5; border-radius: 8px; }
button { background: #005cc2; color: white; cursor: pointer; font-weight: 600; }
button.quest { width: 100%; }
details { background: white; border-radius: 16px; padding: 16px; margin-top: 12px; }
summary { cursor: pointer; font-weight: 600; }
ul { list-style: none; padding: 0; }
li { margin-bottom: 8px; }</style></head><body><!-- APP HTML START --><main>
  <p>MOVE / YOUR DAILY MOMENTUM</p>
  <h1>Every move counts.</h1>
  <p class="tagline">Anywhere can be your gym — no gym required.</p>
  <div class="stats">
    <p><strong id="minutes">0</strong> minutes</p>
    <p><strong id="sessions">0</strong> activities</p>
  </div>
  <div class="goal">
    <p id="goal-label">Daily goal: 0 / 20 minutes</p>
    <progress id="goal-progress" value="0" max="20"></progress>
  </div>
  <button type="button" id="quick-quest" class="quest">⚡ Quick log: 2-min anywhere move</button>
  <details id="more-activity">
    <summary>Log another activity</summary>
    <form id="activity-form">
      <label>Activity <select name="activity"><option>Walk</option><option>Run</option></select></label>
      <label>Minutes <input name="minutes" type="number" min="1" max="300" step="1" value="10" required></label>
      <button type="button" id="log-activity">Log my activity</button>
    </form>
  </details>
  <p id="feedback" role="status">Start with a moment of movement.</p>
  <ul id="activities" aria-label="Logged activities"></ul>
</main><!-- APP HTML END --><script id="app-js">const activities = [];
const DAILY_GOAL_MINUTES = 20;

function logActivity(activity, message) {
  activities.push(activity);
  const totalMinutes = activities.reduce((sum, item) => sum + item.minutes, 0);
  document.getElementById('minutes').textContent = totalMinutes;
  document.getElementById('sessions').textContent = activities.length;
  document.getElementById('goal-progress').value = Math.min(totalMinutes, DAILY_GOAL_MINUTES);
  document.getElementById('goal-label').textContent = totalMinutes >= DAILY_GOAL_MINUTES
    ? 'Daily goal reached — nice!'
    : 'Daily goal: ' + totalMinutes + ' / ' + DAILY_GOAL_MINUTES + ' minutes';
  const row = document.createElement('li');
  row.textContent = activity.type + ' · ' + activity.minutes + ' minutes';
  document.getElementById('activities').prepend(row);
  document.getElementById('feedback').textContent = message;
  parent.postMessage({ source: 'move-starter', activity }, '*');
}

document.getElementById('log-activity').addEventListener('click', () => {
  const form = document.getElementById('activity-form');
  if (!form.reportValidity()) return;
  const minutes = Number(form.elements.minutes.value);
  if (!Number.isInteger(minutes) || minutes < 1 || minutes > 300) return;
  logActivity({ type: form.elements.activity.value, minutes }, 'You made time for yourself. Nice work!');
});

document.getElementById('quick-quest').addEventListener('click', () => {
  logActivity({ type: 'Anywhere move', minutes: 2 }, 'Two minutes, anywhere — that counts. Momentum started!');
});</script></body></html>
